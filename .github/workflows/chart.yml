name: Chart

# Every pull request renders the chart; every merge to main publishes it to
#   oci://ghcr.io/rest-mail/charts/rest-mail
# which is what a cluster installs. A published version is final: OCI would
# move the tag, silently changing what a version means for anyone who already
# installed it, so publishing again means bumping version in Chart.yaml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: charts/rest-mail
  REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Render, and check the parts fit
        run: ${{ env.CHART_DIR }}/tests/render-test.sh

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Unindented only: an umbrella's dependencies carry version: lines of their own.
          version=$(awk '/^version:/ { print $2 }' "$CHART_DIR/Chart.yaml")
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          if helm show chart "$REGISTRY/rest-mail" --version "$version" > /dev/null 2>&1; then
            echo "::error::rest-mail $version is already published — bump version in $CHART_DIR/Chart.yaml" >&2
            exit 1
          fi
          helm package "$CHART_DIR" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/rest-mail-$version.tgz" "$REGISTRY"
          echo "::notice::published $REGISTRY/rest-mail $version"
