# Values for the server subchart live under `server:`, and are the restmail
# chart's own values — see helm/restmail/values.yaml in rest-mail-server for
# every key. Only what differs from that chart's defaults is set here.

server:
  enabled: true

  # The protocol gateways each want a LoadBalancer on a privileged port. The
  # REST API is the whole product without them, and the phone and web clients
  # speak only REST, so they start off. Turn one on where the cluster can give
  # it an address.
  smtpGateway:
    enabled: false
  imapGateway:
    enabled: false
  pop3Gateway:
    enabled: false

  # Supplied by whoever installs this, never generated here: MASTER_KEY
  # encrypts private keys at rest, so a value regenerated on upgrade would make
  # every stored key unreadable.
  #   restmail-api       JWT_SECRET (32+ bytes), MASTER_KEY (16+ bytes)
  #   restmail-postgres  POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
  #   restmail-tls       kubernetes.io/tls, e.g. from a cert-manager Certificate
  api:
    existingSecret: restmail-api
  postgres:
    existingSecret: restmail-postgres
  tls:
    secretName: restmail-tls
